<div
  class="h-full rounded-2xl border border-gray-200 bg-white p-5 sm:p-6 dark:border-gray-800 dark:bg-white/3"
>
  <div class="flex justify-between">
    <div>
      <h3 class="text-lg font-semibold text-gray-800 dark:text-white/90">
        Customers Demographic
      </h3>
      <p class="mt-1 text-sm font-normal text-gray-500 dark:text-gray-400">
        Number of customer based on country
      </p>
    </div>
    <div class="relative inline-block">
      <button app-button variant="unstyled"
        class="dropdown-toggle inline-flex size-8 shrink-0 items-center justify-center rounded-lg text-gray-700 hover:bg-gray-50 hover:text-gray-800 dark:text-gray-300 dark:hover:bg-gray-700/50 dark:hover:text-white"
        [ngClass]="{ 'bg-gray-50 text-gray-800 dark:bg-gray-700/50 dark:text-white': isOpen }"
        (click)="toggleDropdown()"
        aria-label="Toggle options"
        type="button"
      >
        <svg
          class="size-5 stroke-current"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="12" cy="12" r="1" />
          <circle cx="19" cy="12" r="1" />
          <circle cx="5" cy="12" r="1" />
        </svg>
      </button>

      <app-dropdown [isOpen]="isOpen" (close)="closeDropdown()" className="w-40">
        <app-dropdown-item (itemClick)="closeDropdown()">
          View More
        </app-dropdown-item>
        <app-dropdown-item variant="destructive" (itemClick)="closeDropdown()">
          Delete
        </app-dropdown-item>
      </app-dropdown>
    </div>
  </div>

  <div
    class="my-6 overflow-hidden rounded-2xl border border-gray-200 bg-gray-50 px-4 py-6 sm:px-6 dark:border-gray-800 dark:bg-gray-900"
  >
    <div
      id="mapOne"
      class="mapOne map-btn -mx-4 -my-6 h-53 w-63 2xsm:w-76.75 xsm:w-89.5 sm:-mx-6 md:w-167 lg:w-158.5 xl:w-98.25 2xl:w-138.5"
    >
      <app-country-map />
    </div>
  </div>

  <div class="flex flex-col gap-5">
    @for (country of countries; track country.name) {
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="relative size-8 shrink-0 overflow-hidden rounded-lg">
            <img [src]="country.img" [alt]="country.alt" class="size-full object-cover" />
          </div>
          <div>
            <p class="text-sm font-semibold text-gray-800 dark:text-white/90">
              {{ country.name }}
            </p>
            <span class="block text-xs font-normal text-gray-500 dark:text-gray-400">
              {{ country.customers }}
            </span>
          </div>
        </div>

        <div class="flex items-center justify-center">
          <p class="text-sm font-medium text-gray-700 dark:text-gray-300">
            {{ country.percentage }}
          </p>
        </div>
      </div>
    }
  </div>
</div>
