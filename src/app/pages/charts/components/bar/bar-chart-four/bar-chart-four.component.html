<div class="flex flex-col gap-6">
  <!-- Legend Indicators -->
  <div class="flex items-center gap-5">
    <div class="flex items-center gap-1.5">
      <span class="size-2.5 rounded-full bg-brand-500"></span>
      <span class="text-sm font-normal text-gray-700 dark:text-gray-300">
        Category A
      </span>
    </div>
    <div class="flex items-center gap-1.5">
      <span class="size-2.5 rounded-full bg-gray-200 dark:bg-gray-700"></span>
      <span class="text-sm font-normal text-gray-700 dark:text-gray-300">
        Category B
      </span>
    </div>
  </div>

  <div class="max-w-full overflow-x-auto custom-scrollbar">
    <div class="min-w-[650px] xl:min-w-full">
      <apx-chart
        [series]="chartOptions.series!"
        [chart]="chartOptions.chart!"
        [plotOptions]="chartOptions.plotOptions!"
        [colors]="chartOptions.colors!"
        [dataLabels]="chartOptions.dataLabels!"
        [stroke]="chartOptions.stroke!"
        [xaxis]="chartOptions.xaxis!"
        [yaxis]="chartOptions.yaxis!"
        [grid]="chartOptions.grid!"
        [fill]="chartOptions.fill!"
        [tooltip]="chartOptions.tooltip!"
        [legend]="chartOptions.legend!"
      ></apx-chart>
    </div>
  </div>
</div>
