<div class="relative">
  <!-- User Button -->
  <button app-button variant="unstyled"
    class="dropdown-toggle flex items-center text-gray-700 dark:text-gray-400"
    (click)="toggleDropdown($event)"
    type="button"
  >
    <span class="me-3 size-11 overflow-hidden rounded-lg shrink-0">
      <img src="/images/user/owner.png" alt="User" class="size-full object-cover rounded-lg" width="44" height="44" />
    </span>

    <span class="me-1 block text-sm font-medium">Musharof</span>

    <!-- Chevron Icon -->
    <svg
      class="size-5 text-gray-500 duration-200 dark:text-gray-400"
      [ngClass]="isOpen ? 'rotate-180' : 'rotate-0'"
      width="20"
      height="20"
      viewBox="0 0 20 20"
      fill="none"
      xmlns="http://www.w3.org/2000/svg"
    >
      <path
        d="M4.79175 7.396L10.0001 12.6043L15.2084 7.396"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
  </button>

  <!-- Dropdown Start -->
  @if (isOpen) {
    <div
      (mouseleave)="scheduleCloseSubDropdown()"
      class="absolute end-0 mt-3 z-50 flex w-65 flex-col gap-1 rounded-2xl border border-gray-200 bg-white p-3 shadow-theme-lg outline-none dark:border-gray-800 dark:bg-[#1E2635]"
    >
      <!-- User Info -->
      <div class="px-3 py-2">
        <span class="block text-sm font-medium text-gray-700 dark:text-gray-400">
          Musharof Chowdhury
        </span>
        <span class="mt-0.5 block text-xs text-gray-500 dark:text-gray-400">
          randomuser@pimjo.com
        </span>
      </div>

      <!-- Separator -->
      <div class="-mx-3 my-1.5 h-px bg-gray-100 dark:bg-gray-700"></div>

      <!-- Edit Profile -->
      <a
        (mouseenter)="closeSubDropdown()"
        routerLink="/profile"
        (click)="closeDropdown()"
        class="group/dropdown-menu-item relative flex cursor-pointer items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium text-gray-700 outline-hidden transition-colors duration-200 select-none hover:bg-gray-100 hover:text-gray-700 focus:bg-gray-100 focus:text-gray-700 dark:text-gray-300 dark:hover:bg-white/5 dark:hover:text-gray-300"
      >
        <svg
          class="size-6 shrink-0 text-gray-500 group-hover/dropdown-menu-item:text-gray-700 dark:text-gray-400 dark:group-hover/dropdown-menu-item:text-gray-300"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path
            d="M17.775 19.107v-.261a4.5 4.5 0 00-4.5-4.5h-2.55a4.5 4.5 0 00-4.5 4.5v.261M21.25 12a9.25 9.25 0 11-18.5 0 9.25 9.25 0 0118.5 0zm-6.483-2.732a2.768 2.768 0 11-5.536 0 2.768 2.768 0 015.536 0z"
          />
        </svg>
        Edit profile
      </a>

      <!-- Account Settings -->
      <a
        (mouseenter)="closeSubDropdown()"
        routerLink="/profile"
        (click)="closeDropdown()"
        class="group/dropdown-menu-item relative flex cursor-pointer items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium text-gray-700 outline-hidden transition-colors duration-200 select-none hover:bg-gray-100 hover:text-gray-700 focus:bg-gray-100 focus:text-gray-700 dark:text-gray-300 dark:hover:bg-white/5 dark:hover:text-gray-300"
      >
        <svg
          class="size-6 shrink-0 text-gray-500 group-hover/dropdown-menu-item:text-gray-700 dark:text-gray-400 dark:group-hover/dropdown-menu-item:text-gray-300"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path
            d="M6.775 5.52a1.484 1.484 0 00-2.028.542L3.231 8.688c-.41.71-.166 1.617.543 2.027.99.571.99 1.999 0 2.57a1.484 1.484 0 00-.543 2.027l1.516 2.626c.41.71 1.318.953 2.028.543A1.484 1.484 0 019 19.766c0 .82.664 1.484 1.484 1.484h3.032c.82 0 1.484-.664 1.484-1.484a1.484 1.484 0 012.225-1.285c.71.41 1.617.167 2.027-.543l1.516-2.626c.41-.71.167-1.617-.543-2.027a1.484 1.484 0 010-2.57c.71-.41.953-1.317.543-2.027l-1.516-2.626a1.484 1.484 0 00-2.027-.543 1.483 1.483 0 01-2.225-1.285c0-.82-.664-1.484-1.484-1.484h-3.032c-.82 0-1.484.664-1.484 1.484a1.484 1.484 0 01-2.226 1.285z"
          />
          <path
            d="M15.085 12a3.085 3.085 0 11-6.17 0 3.085 3.085 0 016.17 0z"
          />
        </svg>
        Account settings
      </a>

      <!-- Support -->
      <a
        (mouseenter)="closeSubDropdown()"
        routerLink="/profile"
        (click)="closeDropdown()"
        class="group/dropdown-menu-item relative flex cursor-pointer items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium text-gray-700 outline-hidden transition-colors duration-200 select-none hover:bg-gray-100 hover:text-gray-700 focus:bg-gray-100 focus:text-gray-700 dark:text-gray-300 dark:hover:bg-white/5 dark:hover:text-gray-300"
      >
        <svg
          class="size-6 shrink-0 text-gray-500 group-hover/dropdown-menu-item:text-gray-700 dark:text-gray-400 dark:group-hover/dropdown-menu-item:text-gray-300"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M12 8.67h0" stroke-width="1.8" />
          <path
            d="M12 11.215v4.224M21.25 12a9.25 9.25 0 11-18.5 0 9.25 9.25 0 0118.5 0z"
            stroke-width="1.5"
          />
        </svg>
        Support
      </a>

      <!-- Language Submenu Item -->
      <div
        class="relative"
        (mouseenter)="openSubDropdown()"
        (mouseleave)="scheduleCloseSubDropdown()"
      >
        <button app-button variant="unstyled"
          type="button"
          [attr.aria-haspopup]="'menu'"
          [attr.aria-expanded]="subDropdownOpen"
          (click)="toggleSubDropdown($event)"
          class="group/dropdown-menu-sub-trigger relative flex w-full cursor-pointer items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium text-gray-700 outline-hidden transition-colors duration-200 select-none hover:bg-gray-100 hover:text-gray-700 focus:bg-gray-100 focus:text-gray-700 dark:text-gray-300 dark:hover:bg-white/5 dark:hover:text-gray-300"
          [ngClass]="{
            'bg-gray-100 text-gray-700 dark:bg-white/5 dark:text-gray-300': subDropdownOpen
          }"
        >
          <svg
            class="size-6 shrink-0 text-gray-500 group-hover/dropdown-menu-sub-trigger:text-gray-700 dark:text-gray-400 dark:group-hover/dropdown-menu-sub-trigger:text-gray-300"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M12.001 2.75a9.25 9.25 0 019.25 9.25A9.25 9.25 0 0112 21.25m0-18.5A9.25 9.25 0 002.751 12a9.25 9.25 0 009.25 9.25m0-18.5c2.209 0 4 4.141 4 9.25 0 5.107-1.791 9.25-4 9.25m0-18.5c-2.209 0-3.999 4.141-3.999 9.25 0 5.107 1.79 9.25 3.999 9.25M3.246 9h17.508M3.246 15h17.508"
            />
          </svg>

          <span>Language</span>

          <span
            class="ms-auto me-1 inline-flex h-auto items-center gap-1.5 rounded-lg border border-gray-200 bg-gray-50 px-2 py-1 text-xs font-medium text-gray-700 dark:border-gray-800 dark:bg-white/3 dark:text-gray-300"
          >
            <span>{{ currentLang.shortName }}</span>
            <img
              [src]="'/images/icons/' + currentLang.flag"
              [alt]="currentLang.shortName"
              class="size-3.5 shrink-0 overflow-hidden rounded-full object-cover"
            />
          </span>

        </button>

        <!-- Submenu Flyout -->
        @if (subDropdownOpen) {
          <div
            class="absolute top-11 start-[-8px] z-50 flex w-56 flex-col gap-1 rounded-2xl border border-gray-200 bg-white p-2 shadow-theme-lg md:top-0 md:end-[calc(100%+14px)] md:start-auto dark:border-gray-800 dark:bg-[#1E2635]"
          >
            @for (language of languages; track language.id) {
              <button app-button variant="unstyled"
                type="button"
                (click)="selectLanguage(language.id, $event)"
                class="relative flex cursor-pointer items-center justify-between gap-2 rounded-lg px-3 py-2.5 text-start text-sm font-medium transition-colors duration-200 hover:bg-gray-100 hover:text-gray-700 dark:hover:bg-white/5 dark:hover:text-gray-300"
                [ngClass]="
                  currentLocale === language.id
                    ? 'bg-brand-50 text-brand-600 dark:bg-brand-500/15 dark:text-brand-400'
                    : 'text-gray-700 dark:text-gray-300'
                "
              >
                <span class="flex items-center gap-2">
                  <span
                    class="size-1.5 shrink-0 rounded-full transition-opacity"
                    [ngClass]="
                      currentLocale === language.id
                        ? 'bg-brand-500 opacity-100 dark:bg-brand-400'
                        : 'opacity-0'
                    "
                  ></span>
                  <img
                    [src]="'/images/icons/' + language.flag"
                    [alt]="language.name"
                    class="size-5 shrink-0 overflow-hidden rounded-full object-cover"
                  />
                  <span class="truncate">{{ language.name }}</span>
                </span>

                @if (language.badge) {
                  <span
                    class="rounded bg-warning-50 px-1.5 py-0.5 text-xs font-semibold text-warning-600 dark:bg-warning-500/15 dark:text-warning-400"
                  >
                    {{ language.badge }}
                  </span>
                }
              </button>
            }
          </div>
        }
      </div>

      <!-- Separator -->
      <div class="-mx-3 my-1.5 h-px bg-gray-100 dark:bg-gray-700"></div>

      <!-- Sign Out -->
      <a
        (mouseenter)="closeSubDropdown()"
        routerLink="/signin"
        (click)="closeDropdown()"
        class="group/dropdown-menu-item relative flex cursor-pointer items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium text-red-500 outline-hidden transition-colors duration-200 select-none hover:bg-red-50 hover:text-red-600 focus:bg-red-50 focus:text-red-600 dark:text-red-400 dark:hover:bg-red-500/10 dark:hover:text-red-400"
      >
        <svg
          class="size-5 shrink-0 text-red-500 pointer-events-none dark:text-red-400"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path
            d="M4 12h7.75M8 8l-3.998 4 3.997 4M9.75 4.996V4.25a1.5 1.5 0 011.5-1.5h6a1.5 1.5 0 011.5 1.5v15.5a1.5 1.5 0 01-1.5 1.5h-6a1.5 1.5 0 01-1.5-1.5V19"
          />
        </svg>
        Sign out
      </a>
    </div>
  }
</div>
