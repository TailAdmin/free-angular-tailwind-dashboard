<div class="relative flex">
  <!-- Dropdown position: Start -->
  @if (selectPosition === 'start') {
    <div class="absolute ltr:left-0 rtl:right-0">
      <select [value]="selectedCountry" (change)="handleCountryChange($event)"
        class="appearance-none bg-none ltr:rounded-l-lg rtl:rounded-r-lg rtl:rounded-l-none border-0 ltr:border-r rtl:border-l border-gray-200 bg-transparent py-3 ltr:pl-3.5 ltr:pr-8 rtl:pr-3.5 rtl:pl-8 leading-tight text-gray-700 focus:border-brand-300 focus:outline-hidden focus:ring-3 focus:ring-brand-500/10 dark:border-gray-800 dark:text-gray-400">
        @for (country of countries; track $index) {
        <option [value]="country.code"
          class="text-gray-700 dark:bg-gray-900 dark:text-gray-400">
          {{ country.code }}
        </option>
        }
      </select>
      <div
        class="absolute inset-y-0 flex items-center text-gray-700 pointer-events-none bg-none ltr:right-3 rtl:left-3 dark:text-gray-400">
        <svg className="stroke-current" width="20" height="20" viewBox="0 0 20 20" fill="none"
          xmlns="http://www.w3.org/2000/svg">
          <path d="M4.79175 7.396L10.0001 12.6043L15.2084 7.396" stroke="currentColor" strokeWidth="1.5"
            strokeLinecap="round" strokeLinejoin="round" />
        </svg>
      </div>
    </div>
  }

  <!-- Input field -->
  <input type="tel" [placeholder]="placeholder"
    [ngClass]="selectPosition === 'start' ? 'ltr:pr-4 ltr:pl-[84px] rtl:pl-4 rtl:pr-[84px]' : 'ltr:pl-4 ltr:pr-[84px] rtl:pr-4 rtl:pl-[84px]'"
    class="dark:bg-dark-900 h-11 w-full rounded-lg border border-gray-300 bg-transparent py-3 px-4 text-sm text-gray-800 shadow-theme-xs placeholder:text-gray-400 focus:border-brand-300 focus:outline-hidden focus:ring-3 focus:ring-brand-500/10 dark:border-gray-700 dark:bg-gray-900 dark:text-white/90 dark:placeholder:text-white/30 dark:focus:border-brand-800" />

  <!-- Dropdown position: End -->
  @if (selectPosition === 'end') {
    <div class="absolute ltr:right-0 rtl:left-0">
      <select [value]="selectedCountry" (change)="handleCountryChange($event)"
        class="appearance-none bg-none ltr:rounded-r-lg rtl:rounded-l-lg rtl:rounded-r-none border-0 ltr:border-l rtl:border-r border-gray-200 bg-transparent py-3 ltr:pl-3.5 ltr:pr-8 rtl:pr-3.5 rtl:pl-8 leading-tight text-gray-700 focus:border-brand-300 focus:outline-hidden focus:ring-3 focus:ring-brand-500/10 dark:border-gray-800 dark:text-gray-400">
        @for (country of countries; track $index) {
        <option [value]="country.code"
          class="text-gray-700 dark:bg-gray-900 dark:text-gray-400">
          {{ country.code }}
        </option>
        }
      </select>
      <div class="absolute inset-y-0 flex items-center text-gray-700 pointer-events-none ltr:right-3 rtl:left-3 dark:text-gray-400">
        <svg className="stroke-current" width="20" height="20" viewBox="0 0 20 20" fill="none"
          xmlns="http://www.w3.org/2000/svg">
          <path d="M4.79175 7.396L10.0001 12.6043L15.2084 7.396" stroke="currentColor" strokeWidth="1.5"
            strokeLinecap="round" strokeLinejoin="round" />
        </svg>
      </div>
    </div>
  }
</div>
