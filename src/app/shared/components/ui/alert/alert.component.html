<div class="w-full rounded-xl border p-4 text-start" [ngClass]="variantClasses.container">
  <div class="grid grid-cols-[auto_1fr] items-start gap-x-2.5 gap-y-0.5">
    @if (iconSvg) {
      <div class="row-span-2 translate-y-0.5 shrink-0" [ngClass]="variantClasses.icon" [innerHTML]="iconSvg | safeHtml"></div>
    }

    @if (title) {
      <h4 class="text-base font-medium text-gray-800 dark:text-white/90">
        {{ title }}
      </h4>
    }

    <div class="col-start-2">
      @if (message) {
        <p class="text-sm text-gray-500 dark:text-gray-400" [ngClass]="{ 'mb-4': showLink }">{{ message }}</p>
      }

      @if (showLink) {
        <a
          [routerLink]="linkHref"
          class="inline-block mt-3 text-sm font-medium text-gray-500 underline dark:text-gray-400"
        >
          {{ linkText }}
        </a>
      }

      <ng-content></ng-content>
    </div>
  </div>
</div>
